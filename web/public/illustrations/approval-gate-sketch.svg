<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="human-sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" />
    </filter>
  </defs>

  <rect width="500" height="400" fill="#fcfbf9" rx="12" />

  <g filter="url(#human-sketch)">
    <!-- Draft letter / Email template envelope -->
    <rect x="75" y="60" width="350" height="230" rx="8" fill="#ffffff" stroke="#1e3d34" stroke-width="2.4" />
    <path d="M 75 60 L 250 180 L 425 60" fill="none" stroke="#1e3d34" stroke-width="2" />

    <!-- Draft text mock -->
    <line x1="100" y1="130" x2="210" y2="130" stroke="#1e3d34" stroke-width="2.2" />
    <line x1="100" y1="150" x2="380" y2="150" stroke="#7d8590" stroke-width="1.6" />
    <line x1="100" y1="170" x2="350" y2="170" stroke="#7d8590" stroke-width="1.6" />
    <line x1="100" y1="190" x2="310" y2="190" stroke="#7d8590" stroke-width="1.6" />

    <!-- Approval Stamp & Human Hand/Quill Icon -->
    <rect x="250" y="210" width="150" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="4 2" />
    <text x="270" y="238" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">HUMAN APPROVED</text>
    <text x="270" y="256" font-family="monospace" font-size="9" fill="#16a34a">Audit Sign-off Verified</text>

    <!-- Guard Shield Cartoon -->
    <g transform="translate(100, 240)">
      <path d="M 30 10 L 60 20 L 60 55 C 60 80, 30 95, 30 95 C 30 95, 0 80, 0 55 L 0 20 Z" fill="#1e3d34" stroke="#1e3d34" stroke-width="2" />
      <!-- Lock sketch inside shield -->
      <rect x="18" y="45" width="24" height="20" rx="3" fill="#ffffff" />
      <path d="M 22 45 L 22 36 C 22 31, 38 31, 38 36 L 38 45" fill="none" stroke="#ffffff" stroke-width="2.6" />
      <circle cx="30" cy="53" r="2" fill="#1e3d34" />
      <line x1="30" y1="55" x2="30" y2="60" stroke="#1e3d34" stroke-width="2" />
    </g>

    <!-- Character Reviewer Sketch -->
    <g transform="translate(390, 280)">
      <circle cx="20" cy="20" r="16" fill="#ffffff" stroke="#1e3d34" stroke-width="2" />
      <circle cx="15" cy="18" r="1.8" fill="#1e3d34" />
      <circle cx="25" cy="18" r="1.8" fill="#1e3d34" />
      <path d="M 15 26 Q 20 30 25 26" fill="none" stroke="#1e3d34" stroke-width="1.6" />
    </g>
  </g>
</svg>
